name: MCP registry publish via OIDC (one-off)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish io.github.crabcrop/crabcrop to the MCP registry
    runs-on: ubuntu-22.04
    steps:
      - name: Install mcp-publisher
        run: |
          curl -sL -o pub.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz
          tar -xzf pub.tar.gz mcp-publisher
      - name: Write server.json
        run: |
          cat > server.json <<'SERVERJSON'
          {"$schema":"https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json","description":"Sign and explain crabcrop image URLs, fetch processed-image metadata, and purge cached results.","name":"io.github.crabcrop/crabcrop","packages":[{"environmentVariables":[{"description":"Base URL of the crabcrop server the tools act on (for example https://images.example.com).","format":"string","isRequired":false,"isSecret":false,"name":"CRABCROP_BASE"},{"description":"The server's signing secret, used by sign_url and purge_result. Keep it in the environment, not in tool arguments.","format":"string","isRequired":false,"isSecret":true,"name":"CRABCROP_SECRET"}],"identifier":"@crabcrop/mcp","registryBaseUrl":"https://registry.npmjs.org","registryType":"npm","runTimeHint":"npx","transport":{"type":"stdio"},"version":"0.1.0"}],"repository":{"source":"github","url":"https://github.com/dayvson/crabcrop"},"version":"0.1.0"}
          SERVERJSON
      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Login with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP registry
        run: ./mcp-publisher publish
