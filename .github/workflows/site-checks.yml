name: Site checks

# Keeps the site honest against the crabcrop repo:
#   - the signing snippets on index.html and docs.html run against the
#     TypeScript and Python SDKs and the crabcrop-url crate, and every
#     pane on a page mints the same URL as its curl pane;
#   - the configuration tables on docs.html list every variable in
#     docs/configuration.md, with the same defaults.
# The checks run against the latest crabcrop release, the version the
# site's install pulls name, not main: main documents variables and
# behavior that no published image has yet. The weekly run catches a
# release the site has not caught up with. Run it by hand with the
# crabcrop_ref input (main, or any branch, tag, or commit) to see what
# the next release will change.
#
# The checks also diff the error codes, the statuses, and the filter
# tables on docs.html against docs/responses.md and docs/filters.md.
#
# This workflow is also the site's GitHub Pages deploy: on a push to
# main, the build and deploy jobs run only after every check passed, so
# a red check keeps the old site up. That needs Settings > Pages > Build
# and deployment > Source set to "GitHub Actions"; with "Deploy from a
# branch", GitHub's own pages-build-deployment run publishes every push
# to main whatever the checks say.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      crabcrop_ref:
        description: crabcrop branch, tag, or commit to check against (empty for the latest release)
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
      - name: Pick the crabcrop ref
        id: crabcrop
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.crabcrop_ref }}
        run: |
          ref="${REQUESTED:-$(gh api repos/dayvson/crabcrop/releases/latest --jq .tag_name)}"
          test -n "$ref"
          echo "Checking the site against dayvson/crabcrop $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dayvson/crabcrop
          ref: ${{ steps.crabcrop.outputs.ref }}
          path: crabcrop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Configuration tables match docs/configuration.md
        run: node site/.github/site-checks/config-table.mjs crabcrop
      - name: Build the TypeScript SDK
        working-directory: crabcrop/sdks/typescript
        run: npm ci && npm run build
      - name: Signing snippets run and agree
        run: node site/.github/site-checks/snippets.mjs crabcrop
      - name: Error and filter tables match docs/responses.md and docs/filters.md
        run: node site/.github/site-checks/reference-tables.mjs crabcrop

  # The Pages build, the same Jekyll build GitHub's branch deploy runs,
  # so the published files do not change. It runs only after the checks
  # passed (a job that needs another is skipped when that one fails),
  # and only for main: a push, or a run by hand against the latest
  # release (an empty crabcrop_ref). Pull requests, the weekly run, and
  # runs against another crabcrop ref check without deploying.
  build:
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.crabcrop_ref == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, and never cancel one half way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
