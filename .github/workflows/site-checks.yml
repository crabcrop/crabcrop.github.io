name: Site checks

# Keeps the site honest against the crabcrop repo:
#   - the signing snippets on index.html and docs.html run against the
#     TypeScript and Python SDKs and the crabcrop-url crate, and every
#     pane on a page mints the same URL as its curl pane;
#   - the configuration tables on docs.html list every variable in
#     docs/configuration.md, with the same defaults.
# The weekly run catches drift when the repo changes and the site does
# not. Run it by hand against a tag with the crabcrop_ref input.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      crabcrop_ref:
        description: crabcrop branch, tag, or commit to check against
        default: main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dayvson/crabcrop
          ref: ${{ inputs.crabcrop_ref || 'main' }}
          path: crabcrop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Configuration tables match docs/configuration.md
        run: node site/.github/site-checks/config-table.mjs crabcrop
      - name: Build the TypeScript SDK
        working-directory: crabcrop/sdks/typescript
        run: npm ci && npm run build
      - name: Signing snippets run and agree
        run: node site/.github/site-checks/snippets.mjs crabcrop
